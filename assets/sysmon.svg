<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 256 256" width="256" height="256">
  <!-- SysMon icon: a monitor carrying two phosphor traces (P7-green
       CPU spikes, blossom-pink baseline — the app's default accent),
       inspected by a glowing ice-blue magnifying glass whose lens
       shows the traces magnified 1.6x. Phosphor's art language:
       CRT-black ground, sharp corners, neutral hairline frame,
       two-layer traces (saturated halo UNDER a bright core). The
       waveforms are SEMANTICALLY open (they run off both screen
       edges); every other figure closes. -->
  <defs>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="core" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.55"/>
    </filter>

    <!-- green trace: a CPU-history spike line, baseline y=120,
         endpoints ON the screen edges (x=40 and x=216) so nothing
         dangles mid-air -->
    <path id="g-cpu" d="M 36 120 L 56 120 L 64 96 L 72 128 L 84 88 L 92 116
                        L 104 76 L 112 122 L 124 104 L 136 128 L 148 92
                        L 160 118 L 172 84 L 184 126 L 200 108 L 220 112"/>

    <!-- pink trace: the gentler baseline metric below -->
    <path id="g-net" d="M 36 148 L 60 148 L 72 138 L 88 152 L 104 142
                        L 120 154 L 136 140 L 152 152 L 168 144 L 184 154
                        L 200 146 L 220 150"/>

    <!-- the lens clip: everything magnified lives inside the glass -->
    <clipPath id="lens">
      <circle cx="164" cy="140" r="42"/>
    </clipPath>
  </defs>

  <rect width="256" height="256" fill="#050807"/>
  <rect x="8" y="8" width="240" height="240" fill="none"
        stroke="#2a3a32" stroke-width="1.5"/>

  <!-- ══ the hardware: monitor + stand, neutral, sharp corners ══ -->
  <g fill="none" stroke="#5a7266" stroke-width="4.5">
    <rect x="36" y="48" width="184" height="128"/>
    <path d="M 118 176 L 118 192 L 138 192 L 138 176"/>
    <path d="M 92 198 L 164 198"/>
  </g>

  <!-- ══ the screen: two phosphor traces ══ -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use xlink:href="#g-cpu" stroke="#63ffa8" stroke-width="6.0" opacity="0.8" filter="url(#halo)"/>
    <use xlink:href="#g-cpu" stroke="#baffd6" stroke-width="2.8" filter="url(#core)"/>
    <use xlink:href="#g-net" stroke="#ec8fac" stroke-width="5.2" opacity="0.8" filter="url(#halo)"/>
    <use xlink:href="#g-net" stroke="#ffd3e0" stroke-width="2.4" filter="url(#core)"/>
  </g>

  <!-- ══ the lens interior: glass tint, then the traces again at
       1.6x about the lens centre — thicker, brighter, magnified ══ -->
  <circle cx="164" cy="140" r="42" fill="#59bfff" opacity="0.07"/>
  <g clip-path="url(#lens)" fill="none" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(164,140) scale(1.6) translate(-164,-140)">
    <rect x="-20" y="-20" width="296" height="296" fill="#050807"/>
    <use xlink:href="#g-cpu" stroke="#63ffa8" stroke-width="6.4" opacity="0.85" filter="url(#halo)"/>
    <use xlink:href="#g-cpu" stroke="#d6ffe6" stroke-width="3.0" filter="url(#core)"/>
    <use xlink:href="#g-net" stroke="#ec8fac" stroke-width="5.6" opacity="0.85" filter="url(#halo)"/>
    <use xlink:href="#g-net" stroke="#ffe0ea" stroke-width="2.6" filter="url(#core)"/>
  </g>

  <!-- ══ the magnifying glass: ice-blue phosphor ring + handle
       (the ring closes; the handle is a deliberate capsule) ══ -->
  <g fill="none" stroke-linecap="round">
    <circle cx="164" cy="140" r="42" stroke="#59bfff" stroke-width="8.5" opacity="0.8" filter="url(#halo)"/>
    <circle cx="164" cy="140" r="42" stroke="#b3e2ff" stroke-width="4.0" filter="url(#core)"/>
    <path d="M 195 169 L 226 200" stroke="#59bfff" stroke-width="13.0" opacity="0.8" filter="url(#halo)"/>
    <path d="M 195 169 L 226 200" stroke="#b3e2ff" stroke-width="7.0" filter="url(#core)"/>
  </g>
</svg>
