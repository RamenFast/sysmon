<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4148"/>
      <stop offset="1" stop-color="#22272c"/>
    </linearGradient>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3cad2"/>
      <stop offset="1" stop-color="#939ba5"/>
    </linearGradient>
    <linearGradient id="lens-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9adeff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#46c2ff" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#background)"
        stroke="#11151a" stroke-width="4"/>

  <!-- computer tower -->
  <g>
    <rect x="158" y="46" width="56" height="150" rx="9" fill="url(#chassis)"
          stroke="#1b2026" stroke-width="5"/>
    <line x1="168" y1="68" x2="204" y2="68" stroke="#3a4148" stroke-width="6" stroke-linecap="round"/>
    <line x1="168" y1="84" x2="204" y2="84" stroke="#3a4148" stroke-width="6" stroke-linecap="round"/>
    <circle cx="186" cy="112" r="7" fill="#2bb3e8"/>
    <line x1="170" y1="160" x2="202" y2="160" stroke="#79828c" stroke-width="4" stroke-linecap="round"/>
    <line x1="170" y1="172" x2="202" y2="172" stroke="#79828c" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- CRT monitor -->
  <g>
    <rect x="32" y="58" width="118" height="106" rx="12" fill="url(#chassis)"
          stroke="#1b2026" stroke-width="5"/>
    <rect x="46" y="72" width="90" height="76" rx="6" fill="#0d1418"
          stroke="#1b2026" stroke-width="3"/>
    <polyline points="54,128 72,112 86,120 102,96 116,106 128,86"
              fill="none" stroke="#46c2ff" stroke-width="7"
              stroke-linecap="round" stroke-linejoin="round"/>
    <!-- stand -->
    <rect x="72" y="164" width="38" height="12" fill="#79828c" stroke="#1b2026" stroke-width="4"/>
    <rect x="56" y="176" width="70" height="14" rx="6" fill="url(#chassis)"
          stroke="#1b2026" stroke-width="4"/>
  </g>

  <!-- magnifying glass -->
  <g>
    <line x1="86" y1="178" x2="46" y2="218" stroke="#1b2026" stroke-width="26" stroke-linecap="round"/>
    <line x1="86" y1="178" x2="46" y2="218" stroke="#c9882a" stroke-width="17" stroke-linecap="round"/>
    <circle cx="118" cy="146" r="44" fill="url(#lens-glass)"
            stroke="#1b2026" stroke-width="21"/>
    <circle cx="118" cy="146" r="44" fill="none"
            stroke="#e9a83c" stroke-width="13"/>
    <path d="M 92 128 A 32 32 0 0 1 116 114" fill="none" stroke="#ffffff"
          stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
